services:
  # PostgreSQL Database - DISABLED (using local PostgreSQL)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: rtb-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: rtb_user
  #     POSTGRES_PASSWORD: rtb_password
  #     POSTGRES_DB: rtb_database
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./migrations:/docker-entrypoint-initdb.d
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U rtb_user -d rtb_database"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rtb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Node.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtb-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      
      # Database (using host's local PostgreSQL)
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: rtb_database
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # JWT
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 1h
      
      # Scoring Parameters (Defaults)
      DEFAULT_ALPHA: 1.0
      DEFAULT_BETA: 100.0
      DEFAULT_GAMMA: 50.0
      
      # Rate Limiting
      RATE_LIMIT_WINDOW: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - node_modules:/app/node_modules
    command: npm run dev

  # Redis Commander (Optional - GUI for Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rtb-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  # pgAdmin (Optional - GUI for PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rtb-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rtb.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  node_modules:
  pgadmin_data:
