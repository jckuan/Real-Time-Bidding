<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Bidding - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🔥 Real-Time Bidding System</h1>
      <p class="subtitle">Flash Sale & Dynamic Bidding Platform</p>

      <div id="authForm">
        <!-- Login Form -->
        <div id="loginForm" class="form-container">
          <h2>Login</h2>
          <form id="login">
            <div class="form-group">
              <label for="loginEmail">Email</label>
              <input type="email" id="loginEmail" required placeholder="your@email.com">
            </div>
            <div class="form-group">
              <label for="loginPassword">Password</label>
              <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>
          <p class="switch-form">
            Don't have an account? 
            <a href="#" id="showRegister">Register here</a>
          </p>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="form-container" style="display: none;">
          <h2>Register</h2>
          <form id="register">
            <div class="form-group">
              <label for="registerUsername">Username</label>
              <input type="text" id="registerUsername" required placeholder="Your username">
            </div>
            <div class="form-group">
              <label for="registerEmail">Email</label>
              <input type="email" id="registerEmail" required placeholder="your@email.com">
            </div>
            <div class="form-group">
              <label for="registerPassword">Password</label>
              <input type="password" id="registerPassword" required placeholder="••••••••" minlength="6">
              <small>Minimum 6 characters</small>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
          </form>
          <p class="switch-form">
            Already have an account? 
            <a href="#" id="showLogin">Login here</a>
          </p>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>
        <div id="successMessage" class="success-message" style="display: none;"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
