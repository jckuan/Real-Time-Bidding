<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bidding - Real-Time Bidding</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body style="background: #f5f5f5;">
  <header class="header">
    <div class="header-content">
      <h1>🔥 Real-Time Bidding</h1>
      <div class="user-info">
        <span id="userEmail"></span>
        <span class="badge" id="memberWeight"></span>
        <button class="btn btn-secondary" id="backBtn" style="width: auto; padding: 10px 20px;">← Back</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="bidding-container">
      <!-- Bidding Form -->
      <div class="bidding-card">
        <div id="productInfo" class="loading">Loading product details...</div>
        
        <div id="myBidStatus" style="display: none;"></div>

        <div id="biddingForm" style="display: none;">
          <h3>Place Your Bid</h3>
          <div class="bidding-form">
            <div class="form-group">
              <label for="bidPrice">Bid Price ($)</label>
              <input type="number" id="bidPrice" step="0.01" min="0" placeholder="Enter your bid">
              <small id="priceHint"></small>
            </div>
            <button class="btn btn-primary" id="submitBidBtn">Submit Bid</button>
            <button class="btn btn-secondary" id="updateBidBtn" style="display: none;">Update Bid</button>
            <div id="bidError" class="error-message" style="display: none; margin-top: 15px;"></div>
            <div id="bidSuccess" class="success-message" style="display: none; margin-top: 15px;"></div>
          </div>
        </div>
      </div>

      <!-- Live Leaderboard -->
      <div class="bidding-card">
        <div class="leaderboard-header">
          <h3>🏆 Live Leaderboard</h3>
          <span id="connectionStatus">
            <span class="connection-status disconnected"></span>
            Connecting...
          </span>
        </div>

        <div id="leaderboardStats" style="display: none;" class="leaderboard-stats">
          <div class="stat-card">
            <div class="stat-label">Total Bidders</div>
            <div class="stat-value" id="totalBidders">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Highest Score</div>
            <div class="stat-value" id="highestScore">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Entry Threshold</div>
            <div class="stat-value" id="entryThreshold">0</div>
          </div>
        </div>

        <div id="leaderboardContent" class="loading">Connecting to live feed...</div>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="bidding.js"></script>
</body>
</html>
